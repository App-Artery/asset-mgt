# Mutation testing over the guard-bearing modules (issue #12).
#
# NOT part of the `ci` required check, and deliberately so. The run takes on the
# order of tens of minutes because three of the five mutated modules are covered
# only by real-DB integration tests, so most mutants cost a Postgres round-trip
# rather than a function call. A required check with that wall time would be
# paid on every PR — including the large majority that touch none of these
# files — and a slow required check gets worked around, not waited for.
#
# It therefore runs:
#   - weekly, so the number does not silently rot;
#   - on demand (`gh workflow run "Mutation testing"`, or the Actions tab).
#
# NO PULL-REQUEST TRIGGER, changed 2026-08-07 (AM-04). It used to run on PRs
# touching a mutated module, on the reasoning that the moment a guard is being
# written is when the falsifiability question is live. That reasoning is still
# right, and the trigger was removed anyway, for a reason worth writing down:
# AM-04 added four modules to `mutate`, which took the run from ~13 minutes to
# ~29, and a job of that length attached to every push became something a human
# had to WATCH AND CANCEL. A check people cancel is worse than no check — it
# burns runner minutes, it trains everyone to dismiss a red mark, and the one
# time it was reporting something real nobody would look.
#
# WHAT THIS COSTS, stated plainly rather than discovered later: a PR that adds a
# guard nothing can falsify is no longer caught before merge. The primary
# defence is unchanged and was always the real one — every guard a condition
# names is red-proved BY HAND, by deleting the production line it defends and
# watching a named test fail. Mutation testing is the backstop that finds the
# guards nobody thought to hand-prove, and it is now a weekly backstop rather
# than a per-PR one. On AM-04 it earned that role: it found two real bugs in
# code that already had 21 hand red-proofs.
#
# Run it deliberately when writing or editing a guard. `pnpm test:mutation`
# locally, scoped with `--mutate src/lib/<file>.ts`, is the fast loop; the full
# sweep belongs to the schedule.
#
# It CAN still fail: `thresholds.break` in stryker.config.mjs is a hard gate.
# A red WEEKLY run is now the signal, and a weekly run that stays red is not a
# tolerable steady state — it is the thing that makes the next real regression
# invisible. Fix it or change the threshold deliberately; do not let it sit.
#
# `mutate` in stryker.config.mjs is now the single source of truth for scope.
# There is no `paths` list here to keep in sync with it — which also removes the
# drift that had already happened once: AM-04's four modules were added to
# `mutate` and not to `paths`, and the job only kept firing because the new
# tests matched a neighbouring `src/lib/*.test.ts` glob.
name: Mutation testing

on:
  schedule:
    # Mondays 02:30 UTC — before the working week, after the nightly backup.
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    # The run is long by design; the default 360-minute job timeout would let a
    # hung test runner burn six hours of runner time before anyone noticed.
    timeout-minutes: 90
    services:
      postgres:
        # Keep this major in sync with ci.yml, docker-compose.yml and Neon.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asset_mgt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # NOT optional. asset-admin.ts, person-visibility.ts and sign-in-policy.ts
      # are covered only by integration tests gated on
      # `describe.skipIf(!process.env.TEST_DATABASE_URL)`: without this the
      # suites skip rather than fail, every mutant in those three modules
      # survives, and the reported score is measurement error rather than a
      # low score. stryker.config.mjs throws if this is unset — leave that
      # guard in place rather than trusting this line to stay here.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asset_mgt_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation

      # The HTML report is how a survivor gets triaged: it shows the mutant, the
      # line, and which tests ran without killing it. Uploaded even on failure —
      # a failing run is precisely when it is needed.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
          retention-days: 14
          if-no-files-found: warn
