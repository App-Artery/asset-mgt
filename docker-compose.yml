# Local development Postgres. Pinned to major 17 — Neon's current default;
# verify the provisioned Neon project's Postgres major at provisioning time
# and keep this pin (and .github/workflows/*) in sync with it.
services:
  postgres:
    image: postgres:17
    ports:
      # Host port 5433 to avoid clashing with other local Postgres instances;
      # keep .env DATABASE_URL/TEST_DATABASE_URL pointing at 5433.
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asset_mgt
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the asset_mgt_test database for real-DB integration tests.
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
